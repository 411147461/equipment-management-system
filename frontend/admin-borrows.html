<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <!-- 讓手機、平板也能正常顯示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>所有借用紀錄 - 設備管理系統</title>

    <!-- 載入原本的 CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =========================
         導覽列
         ========================= -->

    <header class="navbar">

        <div class="navbar-brand">

            <div class="navbar-logo">
                EMS
            </div>

            <span>
                設備管理系統
            </span>

        </div>


        <!-- 管理員資訊 -->

        <div class="navbar-user">

            <span id="userName">
                管理員
            </span>

            <span
                class="role-badge"
                id="userRole"
            >
                admin
            </span>


            <!-- 返回設備列表 -->

            <button
                class="logout-button"
                id="backButton"
            >
                返回設備
            </button>


            <!-- 登出 -->

            <button
                class="logout-button"
                id="logoutButton"
            >
                登出
            </button>

        </div>

    </header>



    <!-- =========================
         主要內容
         ========================= -->

    <main class="dashboard">


        <!-- =========================
             頁面標題
             ========================= -->

        <section class="welcome-section">

            <div>

                <p class="welcome-label">
                    Equipment Management System
                </p>

                <h1>
                    所有借用紀錄
                </h1>

                <p>
                    查看系統中所有使用者的設備借用狀況。
                </p>

            </div>

        </section>

        <!-- =========================
        借用紀錄篩選
        ========================= -->

    <div class="borrow-filters">

        <!-- 使用者篩選 -->

        <div class="filter-group">

            <label for="userFilter">
                使用者
            </label>

            <select id="userFilter">

                <option value="all">
                    全部使用者
                </option>

            </select>

        </div>


        <!-- 借用狀態 -->

        <div class="filter-group">

            <label for="statusFilter">
                借用狀態
            </label>

            <select id="statusFilter">

                <option value="all">
                    全部狀態
                </option>

                <option value="borrowed">
                    借用中
                </option>

                <option value="returned">
                    已歸還
                </option>

            </select>

        </div>


        <!-- 清除篩選 -->

        <button
            type="button"
            id="clearFilterButton"
            class="cancel-button"
        >
            清除篩選
        </button>

    </div>

        <!-- =========================
             借用紀錄
             ========================= -->

        <section class="equipment-section">


            <div class="section-header">

                <div>

                    <h2>
                        借用紀錄
                    </h2>

                    <p>
                        管理員可以查看所有設備借用紀錄
                    </p>

                </div>

            </div>


            <!-- JavaScript 會將紀錄放在這裡 -->

            <div
                id="borrowList"
                class="equipment-grid"
            >

                <div class="loading">
                    載入借用紀錄中...
                </div>

            </div>


        </section>


    </main>



    <!-- 載入 JavaScript -->

    <script src="js/admin-borrows.js"></script>


</body>

</html>
