<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <!-- 設定網頁編碼 -->
    <meta charset="UTF-8">

    <!-- RWD 設定 -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- 網頁標題 -->
    <title>註冊 | 設備管理系統</title>

    <!-- 載入共用 CSS -->
    <link rel="stylesheet"
          href="./style.css">

</head>


<body class="auth-page">

    <!-- =========================
         註冊頁面
         ========================= -->

    <main class="auth-container">

        <!-- 系統標題 -->

        <div class="auth-header">

            <div class="logo">
                EMS
            </div>

            <h1>設備管理系統</h1>

            <p>
                Equipment Management System
            </p>

        </div>


        <!-- 註冊卡片 -->

        <div class="auth-card">

            <h2>建立帳號</h2>

            <p class="auth-description">
                填寫以下資料建立新帳號
            </p>


            <!-- =========================
                 註冊表單
                 ========================= -->

            <form id="registerForm">


                <!-- 使用者名稱 -->

                <div class="form-group">

                    <label for="username">
                        使用者名稱
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="請輸入使用者名稱"
                        required
                    >

                </div>


                <!-- 姓名 -->

                <div class="form-group">

                    <label for="name">
                        姓名
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="請輸入姓名"
                        required
                    >

                </div>


                <!-- 密碼 -->

                <div class="form-group">

                    <label for="password">
                        密碼
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="請輸入密碼"
                        required
                    >

                </div>


                <!-- 確認密碼 -->

                <div class="form-group">

                    <label for="confirmPassword">
                        確認密碼
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="再次輸入密碼"
                        required
                    >

                </div>


                <!-- 註冊按鈕 -->

                <button
                    type="submit"
                    class="primary-button"
                >
                    建立帳號
                </button>


                <!-- 訊息 -->

                <p
                    id="message"
                    class="form-message"
                ></p>

            </form>


            <!-- 返回登入 -->

            <div class="auth-footer">

                <span>
                    已經有帳號？
                </span>

                <a href="./login.html">
                    返回登入
                </a>

            </div>

        </div>

    </main>


    <!-- 註冊 JavaScript -->

    <script src="./js/register.js"></script>

</body>

</html>
