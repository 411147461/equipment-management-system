<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">

    <!-- 讓網頁在手機、平板等裝置上也能正常顯示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>設備管理系統</title>

    <!-- 載入 CSS 樣式 -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         導覽列
         ========================= -->

    <header class="navbar">

        <!-- 系統 Logo -->

        <div class="navbar-brand">

            <div class="navbar-logo">
                EMS
            </div>

            <span>
                設備管理系統
            </span>

        </div>

        <!-- 使用者資訊與功能按鈕 -->
       <div class="navbar-user">

    <span id="userName">
        使用者
    </span>

    <span
        id="userRole"
        class="role-badge"
    >
        user
    </span>

    <!-- Admin：所有借用紀錄 -->

    <button
        id="adminBorrowButton"
        class="nav-button admin-only"
        style="display: none;"
        onclick="window.location.href='admin-borrows.html'"
    >
         所有借用紀錄
    </button>

    <!-- 我的借用紀錄 -->

    <button
        id="myBorrowButton"
        class="nav-button"
        onclick="window.location.href='my-borrows.html'"
    >
        我的借用紀錄
    </button>

    <button
        id="logoutButton"
        class="logout-button"
    >
        登出
    </button>

</div>

    </header>


    <!-- =========================
         主要內容
         ========================= -->

    <main class="dashboard">

        <!-- =========================
             歡迎區域
             ========================= -->

        <section class="welcome-section">

            <div>

                <p class="welcome-label">
                    Equipment Management System
                </p>

                <h1>
                    歡迎回來，
                    <span id="welcomeName">
                        使用者
                    </span>
                </h1>

                <p>
                    您可以在這裡查看與管理設備。
                </p>

            </div>

        </section>


        <!-- =========================
             統計卡片
             ========================= -->

        <section class="stats-grid">

            <!-- 設備總數 -->

            <div class="stat-card">

                <div class="stat-icon">
                    📦
                </div>

                <div>

                    <p>
                        設備總數
                    </p>

                    <h2 id="totalEquipment">
                        0
                    </h2>

                </div>

            </div>


            <!-- 可借用 -->

            <div class="stat-card">

                <div class="stat-icon">
                    🟢
                </div>

                <div>

                    <p>
                        可借用
                    </p>

                    <h2 id="availableEquipment">
                        0
                    </h2>

                </div>

            </div>


            <!-- 借出中 -->

            <div class="stat-card">

                <div class="stat-icon">
                    🔴
                </div>

                <div>

                    <p>
                        借出中
                    </p>

                    <h2 id="borrowedEquipment">
                        0
                    </h2>

                </div>

            </div>

        </section>


        <!-- =========================
             管理員：新增設備
             ========================= -->

        <section
            class="form-section admin-only"
            id="addEquipmentSection"
        >

            <div class="section-header">

                <div>

                    <h2>
                        新增設備
                    </h2>

                    <p>
                        新增設備至系統
                    </p>

                </div>

            </div>


            <form id="equipmentForm">

                <div class="form-grid">


                    <!-- 設備名稱 -->

                    <div class="form-group">

                        <label for="name">
                            設備名稱
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="例如：Arduino UNO"
                            required
                        >

                    </div>


                    <!-- 設備分類 -->

                    <div class="form-group">

                        <label for="category">
                            設備分類
                        </label>

                        <input
                            type="text"
                            id="category"
                            name="category"
                            placeholder="例如：Development Board"
                            required
                        >

                    </div>


                    <!-- 設備狀態 -->

                    <div class="form-group">

                        <label for="status">
                            設備狀態
                        </label>

                        <select
                            id="status"
                            name="status"
                        >

                            <option value="available">
                                可借用
                            </option>

                            <option value="borrowed">
                                借出中
                            </option>

                        </select>

                    </div>


                    <!-- 設備描述 -->

                    <div class="form-group">

                        <label for="description">
                            設備描述
                        </label>

                        <input
                            type="text"
                            id="description"
                            name="description"
                            placeholder="輸入設備描述"
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="primary-button"
                >
                    ＋ 新增設備
                </button>

            </form>

        </section>


        <!-- =========================
             管理員：修改設備
             ========================= -->

        <section
            class="form-section admin-only"
            id="editSection"
            style="display: none;"
        >

            <div class="section-header">

                <div>

                    <h2>
                        修改設備
                    </h2>

                    <p>
                        修改目前設備資訊
                    </p>

                </div>

            </div>


            <form id="editEquipmentForm">

                <!-- 儲存設備 ID -->

                <input
                    type="hidden"
                    id="editId"
                >


                <div class="form-grid">


                    <!-- 設備名稱 -->

                    <div class="form-group">

                        <label for="editName">
                            設備名稱
                        </label>

                        <input
                            type="text"
                            id="editName"
                            required
                        >

                    </div>


                    <!-- 設備分類 -->

                    <div class="form-group">

                        <label for="editCategory">
                            設備分類
                        </label>

                        <input
                            type="text"
                            id="editCategory"
                            required
                        >

                    </div>


                    <!-- 設備狀態 -->

                    <div class="form-group">

                        <label for="editStatus">
                            設備狀態
                        </label>

                        <select id="editStatus">

                            <option value="available">
                                可借用
                            </option>

                            <option value="borrowed">
                                借出中
                            </option>

                        </select>

                    </div>


                    <!-- 設備描述 -->

                    <div class="form-group">

                        <label for="editDescription">
                            設備描述
                        </label>

                        <input
                            type="text"
                            id="editDescription"
                        >

                    </div>

                </div>


                <div class="form-actions">

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        儲存修改
                    </button>

                    <button
                        type="button"
                        class="cancel-button"
                        id="cancelEditButton"
                    >
                        取消
                    </button>

                </div>

            </form>

        </section>


        <!-- =========================
             設備列表
             ========================= -->

        <section class="equipment-section">

            <div class="section-header">

                <div>

                    <h2>
                        設備列表
                    </h2>

                    <p>
                        查看目前系統中的所有設備
                    </p>

                </div>

            </div>


            <!-- JavaScript 會把設備卡片放進這裡 -->

            <div
                id="equipmentList"
                class="equipment-grid"
            >

                <div class="loading">
                    載入設備中...
                </div>

            </div>

        </section>

    </main>


    <!-- 載入 JavaScript -->

    <script src="app.js"></script>

</body>

</html>
