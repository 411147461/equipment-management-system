<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <!--
        讓網頁在手機、平板等裝置上
        都可以正常顯示
    -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>我的借用紀錄 - 設備管理系統</title>

    <!--
        載入主要 CSS
        使用和首頁相同的 style.css
    -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- ======================================== -->
    <!-- 網頁主要內容 -->
    <!-- ======================================== -->

    <main class="dashboard">


        <!-- ======================================== -->
        <!-- 頁面標題 -->
        <!-- ======================================== -->

        <h1>我的借用紀錄</h1>

        <p class="subtitle">
            My Borrow Records
        </p>


        <!-- ======================================== -->
        <!-- 返回設備列表 -->
        <!-- ======================================== -->

        <div class="page-actions">

            <button
                type="button"
                class="submit-button"
                onclick="goToEquipmentPage()"
            >
                返回設備列表
            </button>

        </div>


        <!-- ======================================== -->
        <!-- 使用者資訊 -->
        <!-- ======================================== -->

        <section class="form-section">

            <h2>目前登入資訊</h2>

            <p>
                <strong>使用者：</strong>

                <span id="userName">
                    載入中...
                </span>
            </p>

        </section>


        <!-- ======================================== -->
        <!-- 借用紀錄 -->
        <!-- ======================================== -->

        <section>

            <h2>借用紀錄</h2>


            <!--
                JavaScript 會將 Backend 回傳的
                借用紀錄顯示在這裡
            -->
            <div id="borrowList">

                載入中...

            </div>

        </section>


    </main>


    <!-- ======================================== -->
    <!-- 載入 JavaScript -->
    <!-- ======================================== -->

    <script src="./js/my-borrows.js"></script>

</body>

</html>
